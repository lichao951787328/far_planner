# FAR 算法参数覆盖。五分类的 label、颜色、角色和语义代价只在
# five_class_semantic_schema.yaml 中定义，本文件不保存类别表副本。
world_frame: map_start
use_local_voxel_map: true
local_voxel_topic: /local_3d_semantic_voxel_map/voxel_cloud
local_voxel_observation_frame: wuba_base
local_voxel_timeout: 1.0
local_voxel_morphology_enabled: true
local_voxel_morphology_raster_resolution: 0.01
local_voxel_morphology_radius: 0.01
enable_goal_recording: false

# When a previously unknown RViz goal is later confirmed inside a static
# obstacle, select a sparse, explicitly traversable substitute within 2 m.
# Dynamic occupancy and unknown space never move the command.
GPlanner/enable_goal_adjustment: true

contour_grid_resolution: 0.2
sensor_range: 9.0
terrain_range: 9.0
# The five-class segmentation leaves short zig-zag runs along otherwise
# continuous obstacle boundaries.  Merge those runs more aggressively than
# the generic profile while the angle gate still preserves real corners.
CDetector/dynamic_simplify_ratio: 2.5
CDetector/collinear_tolerance: 0.50
CDetector/collinear_angle_deg: 15.0
MapHandler/semantic_local_window_radius: 9.0
MapHandler/local_planner_radius: 9.0
MapHandler/local_voxel_resolution: 0.10
# Compatibility/diagnostic parameter; low confidence no longer means dynamic.
MapHandler/local_voxel_min_semantic_confidence: 0.55
MapHandler/local_voxel_obstacle_cost_threshold: 0.55
ContourGraph/local_window_min_x: -4.0
ContourGraph/local_window_max_x: 8.0
ContourGraph/local_window_min_y: -5.0
ContourGraph/local_window_max_y: 5.0

# 明确 dynamic label 才进入瞬态层；其余所有高代价体素（包括 label=0、
# 未知 label 和低语义置信度）都作为普通静态候选几何。局部 box 是短前向
# crop；若要求 15 次 FAR 更新，大部分墙角会在晋升前离开窗口，历史图将
# 无法持续生长。三次观测（main_run_freq=2.5 Hz 时约 1.2 s）足以衔接相邻
# 局部窗口。节点仍须具有可复用拓扑并属于持续生长的静态主连通分量；不融合
# 外部 SemanticOcTree 证据。旧轮廓只有在局部地形支撑明确可见且连续确认无
# 障碍后才会退出历史 Graph。
Graph/static_confirm_frames: 3
Graph/static_promotion_requires_finalized: false
Graph/static_promotion_requires_active_edge: true
Graph/static_promotion_requires_main_component: true
Graph/static_promotion_requires_global_evidence: false
Graph/static_visibility_remove_frames: 3
# 旧角点连续三帧被可靠的新轮廓线段替代后，才允许原子删除；靠近 CLIP 的
# 不可靠局部段不累计，但远离 CLIP 且两侧均处于 W_inner 的线段内部可以作为
# 替代证据。提交前必须已有当前有效替代边并保持 Graph 连通。
Graph/static_topology_remove_frames: 3
# Odom/start query edges may connect only to Graph nodes within this planar
# distance. This also removes an existing start edge after the robot moves out
# of range; it does not limit persistent obstacle-to-obstacle Graph topology.
Graph/start_connection_max_distance: 20.0
# Three contour cells.  Duplicate suppression still requires the same corner
# type, compatible free-space direction and a collision-free local match, so
# opposite door-frame corners are not merged solely because they are nearby.
# 静态轮廓节点的重复抑制半径，单位是米。
# 当新提取出一个静态障碍轮廓拐点时，如果在二维水平距离 0.3m 内已经有非常相似的静态节点，新的候选节点就不会加入 Graph。
Graph/static_duplicate_radius: 0.4
# 近距离节点连边失败的诊断范围，单位也是米。Graph 在检查两个节点能不能建立可见边时，如果节点距离 <= 3.0m，就会打印诊断信息，帮助分析为什么近距离节点连边失败。
Graph/diagnostic_near_pair_radius: 3.0

# Simplify nearly collinear three-edge loops after all contour and odom edges
# have been validated. The removable edge must be the unique longest ordinary
# visibility edge; the two shorter active sides remain as the replacement.
Graph/flat_triangle_pruning_enabled: true
Graph/flat_triangle_max_detour_ratio: 1.05
Graph/flat_triangle_max_altitude_ratio: 0.20

# FAR 的 local_voxel_*_labels 和 obstacle/terrain/dynamic RGB groups 均在
# 启动时由 /semantic_schema/classes 自动生成。
