# SSMI bag integration overrides.
#
# launch/ssmi_bag_graph_test.launch loads default.yaml first and then this
# file.  Keeping only the data-source-specific values here avoids duplicating
# the planner tuning while still making the semantic contract explicit.

world_frame                             : map_start
use_local_voxel_map                     : true
local_voxel_topic                       : /local_3d_semantic_voxel_map/voxel_cloud
local_voxel_observation_frame           : wuba_base
local_voxel_timeout                     : 1.0
local_voxel_morphology_enabled          : true
local_voxel_morphology_raster_resolution: 0.01
local_voxel_morphology_radius           : 0.01
enable_goal_recording                   : false

# FAR consumes the 0.10 m local voxel snapshot directly. The contour raster
# remains independent from MapHandler/local_planner_resolution, which controls
# dense collision samples for downstream consumers.
contour_grid_resolution                 : 0.2
sensor_range                            : 9.0
terrain_range                           : 9.0
MapHandler/semantic_local_window_radius : 9.0
MapHandler/local_planner_radius         : 9.0
MapHandler/local_voxel_resolution       : 0.10
# Compatibility/diagnostic parameter; low confidence no longer means dynamic.
MapHandler/local_voxel_min_semantic_confidence: 0.55
MapHandler/local_voxel_obstacle_cost_threshold: 0.60
ContourGraph/local_window_min_x         : -2.0
ContourGraph/local_window_max_x         : 10.0
ContourGraph/local_window_min_y         : -5.0
ContourGraph/local_window_max_y         : 5.0
MapHandler/local_voxel_static_labels    : [2, 3, 4, 5, 6, 7, 8]
MapHandler/local_voxel_terrain_labels   : [0, 1, 9]
MapHandler/local_voxel_dynamic_labels   : [11, 12, 13, 14, 15, 16, 17, 18]

# Keep the validated robot geometry unchanged during the data-adapter test.
vehicle_height                          : 0.5
robot_dim                               : 0.6
Util/robot_collision_clearance          : 0.45

# The rolling box is short in the forward direction, so waiting for FAR's
# separate six-frame position/direction finalizer can let every corner leave
# the window before it becomes persistent.  Three matched local snapshots are
# the persistence vote; reusable topology and main-component membership remain
# mandatory below.
Graph/static_confirm_frames             : 3
Graph/static_promotion_requires_finalized: false
Graph/static_promotion_requires_active_edge: true
# Candidate chains grow from the persisted main graph; current odom visibility
# is required only for the first bootstrap, not for later map expansion.
Graph/static_promotion_requires_main_component: true
Graph/static_promotion_requires_global_evidence: false
Graph/static_visibility_remove_frames   : 3
Graph/static_duplicate_radius           : 0.4
# Record why geometrically close visibility candidates are not selected. The
# marker-only diagnostic does not change graph construction or edge voting.
Graph/diagnostic_near_pair_radius: 3.0
