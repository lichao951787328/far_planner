# Five-class /grids_points profile for 2026-08-21-17-16-20.bag.
# Input labels:
#   0 background (hard obstacle), 1 flat ground, 2 grass,
#   3 rough ground, 4 manhole cover (hard obstacle).

input_topic: /grids_points
global_frame: map
use_initial_pose_reference: true
# Keep map_start gravity-aligned: remove only the initial translation and yaw.
initial_pose_reference_yaw_only: true
reference_frame: map_start
local_cost_frame: wuba_base
publish_local_cost_cloud: true
global_admission_output_frame: wuba_base
global_admission_exclude_dynamic: true

# The generic direct encoder assumes Cityscapes label meanings.  This dataset
# uses a different label contract, so the configurable SSMI grid adapter owns
# the conversion instead.
# 关闭 local voxel 节点自带的“直接 SSMI 格式点云发布器”。当前设成 false 是正确的，因为自带直接编码器使用固定的 canonical/Cityscapes 颜色编码，并不了解你的五分类语义含义。
publish_ssmi_admitted_cloud: false
ssmi_admitted_topic: /semantic_pcl/five_class_global_admitted
ssmi_obstacle_traversability_threshold: 0.75

# 这些参数控制“SSMI 旧障碍撤销”机制：
# 某个体素以前作为障碍写进了 SemanticOctomap，后来被稳定观测为平地时，发布删除证据，把旧障碍从全局地图中清除。
enable_ssmi_obstacle_revocation: true
ssmi_revocation_voxel_size: 0.10
ssmi_revocation_minimum_free_frames: 5 # 至少连续 5 个新采集帧提供自由证据
ssmi_revocation_minimum_free_duration: 0.5 # 自由证据从第一帧到当前至少持续 0.5 秒
ssmi_revocation_free_max_traversability: 0.45 # 作为自由地形证据的点，代价必须 <=0.45
ssmi_revocation_minimum_semantic_confidence: 0.60 # 自由地形语义置信度必须 >=0.60
ssmi_revocation_ray_evidence_enabled: false # 当前不使用传感器射线穿透作为自由证据
ssmi_revocation_ray_endpoint_margin: 0.20 # 开启射线证据时，不使用射线末端最后 0.2 m，防止表面回波清除自己
ssmi_revocation_ray_point_stride: 2 # 开启射线证据时，每隔 2 个输入点构造一条射线
# This navigation profile treats every class except flat ground as a static
# obstacle. These roles also drive explicit removal of an old global obstacle
# voxel after stable flat-ground reclassification.
ssmi_revocation_obstacle_labels: [0, 2, 3, 4]
ssmi_revocation_terrain_labels: [1]
ssmi_revocation_dynamic_labels: [11]

# The old boundary filter assumed that labels 1..3 were all traversable terrain
# and removed label-0 seams between different terrain classes. Only label 1 is
# traversable now, so keep this filter disabled to avoid deleting real obstacle
# boundaries belonging to labels 0, 2, 3, or 4.
terrain_boundary_filter_enabled: false
terrain_boundary_obstacle_label: 0 # 只检查这个障碍标签。当前只处理 label 0，不处理 2、3、4
terrain_boundary_terrain_labels: [1] # 哪些标签可以作为周围地形，以及 label 0 最终可以改成哪些标签
terrain_boundary_opening_radius_cells: 2 # 使用形态学开运算找细小障碍区域
terrain_boundary_neighborhood_radius: 0.40 # 检查候选障碍周围多大范围的语义体素
terrain_boundary_vertical_tolerance: 0.2 # 搜索周围体素时允许的上下高度差
terrain_boundary_minimum_terrain_neighbors: 4 # 周围至少需要多少个地形体素
terrain_boundary_minimum_distinct_terrain_labels: 2 # 周围至少要出现多少种不同地形标签
terrain_boundary_minimum_terrain_ratio: 0.60 # 周围地形体素占“地形+label0障碍”的最低比例

terrain_height_cost_enabled: false
input_layout: point_cloud
point_stride: 1
semantic_field: semantic_lable
semantic_label_remap: []
confidence_field: semantic_confidence
cost_field: traversability
default_semantic_confidence: 1.0
transform_timeout: 0.2
timing_report_frames: 50

voxel_size_xy: 0.10
voxel_size_z: 0.10
decay_seconds: 0.5
max_voxels: 300000
max_range: -1.0
# Fixed map_start admission envelope. Keep this wider than the sensor-local box
# so normal elevation/pitch variation is not clipped after frame conversion.
min_z: -5.0
max_z: 4.0
local_radius: -1.0
local_box_enabled: true
local_box_min_x: -2.0
local_box_max_x: 10.0
local_box_min_y: -5.0
local_box_max_y: 5.0
local_box_min_z: -2.0
local_box_max_z: 4.0
robot_body_exclusion_enabled: false

semantic_positive_update: 1.0
semantic_negative_update: -0.1
semantic_min_log_evidence: -4.59512
semantic_max_log_evidence: 4.59512
semantic_new_class_prior: 0.8

unknown_cost: 0.50
# Preserve hard semantic obstacle costs instead of attenuating them by the
# dominant-class confidence when measured traversability is lower.
traversability_fusion_method: maximum
semantic_risk_alpha: 0.80
semantic_cost_weight: 0.0
cost_rise_alpha: 0.70
cost_fall_alpha: 0.15

# Every semantic class except flat ground is configured as a hard obstacle.
# FAR uses the static-label role for contour extraction and graph construction;
# the cost is also set to 1.0 for consumers of the traversability cost cloud.
semantic_classes:
  - {label: 0, name: background_obstacle, color: [0, 0, 0],     cost: 1.00}
  - {label: 1, name: flat_ground,         color: [0, 255, 0],   cost: 0.05}
  - {label: 2, name: grass,               color: [0, 128, 0],   cost: 1.00}
  - {label: 3, name: rough_ground,        color: [160, 82, 45], cost: 1.00}
  - {label: 4, name: manhole_cover,       color: [128, 128, 128], cost: 1.00}

publish_rate: 10.0
marker_alpha: 0.85
map_file: /tmp/five_class_local3d_semantic_voxel_map.csv
