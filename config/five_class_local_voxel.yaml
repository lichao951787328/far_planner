# Five-class /grids_points profile for 2026-08-21-17-16-20.bag.
# Input labels:
#   0 background (hard obstacle), 1 flat ground, 2 grass,
#   3 rough ground, 4 manhole cover (hard obstacle).

input_topic: /grids_points
global_frame: map
use_initial_pose_reference: true
# Keep map_start gravity-aligned: remove only the initial translation and yaw.
initial_pose_reference_yaw_only: true
reference_frame: map_start
local_cost_frame: wuba_base
publish_local_cost_cloud: true
global_admission_output_frame: wuba_base
global_admission_exclude_dynamic: true

# The generic direct encoder assumes Cityscapes label meanings.  This dataset
# uses a different label contract, so the configurable SSMI grid adapter owns
# the conversion instead.
publish_ssmi_admitted_cloud: false
ssmi_admitted_topic: /semantic_pcl/five_class_global_admitted
ssmi_obstacle_traversability_threshold: 0.75

enable_ssmi_obstacle_revocation: true
ssmi_revocation_voxel_size: 0.10
ssmi_revocation_minimum_free_frames: 5
ssmi_revocation_minimum_free_duration: 0.5
ssmi_revocation_free_max_traversability: 0.45
ssmi_revocation_minimum_semantic_confidence: 0.60
ssmi_revocation_ray_evidence_enabled: false
ssmi_revocation_ray_endpoint_margin: 0.20
ssmi_revocation_ray_point_stride: 2
# This navigation profile treats labels 0 and 4 as static obstacles and 1..3 as
# traversable terrain. These roles also drive explicit removal of an old global
# obstacle voxel after stable terrain reclassification.
ssmi_revocation_obstacle_labels: [0, 4]
ssmi_revocation_terrain_labels: [1, 2, 3]
ssmi_revocation_dynamic_labels: [11]

# Segmentation sometimes inserts a one-voxel-wide label-0 seam where two
# terrain classes meet. Treat 1..3 as one terrain super-class only for this
# obstacle validation; their published labels/colors/costs remain distinct.
# A candidate is changed only when the configured native-grid opening removes it and
# the neighborhood contains at least two different terrain classes.

# - opening_radius_cells: 1
#   - 当前体素分辨率是 0.1 m。
#   - 1 表示 3×3 开运算，主要去除宽度约 1～2 个体素，也就是约 0.1～0.2 m 的细条、斑点。
#   - 设置为 2 就是 5×5，会去除更大的区域，但很容易误删细杆、路沿、小型动态障碍，不建议一开始使用。
# 其余参数是安全保护条件：
# - neighborhood_radius: 0.20
#   - 检查候选障碍周围约 0.2 m 的语义。
#   - 调大到 0.30：更容易发现两侧地形，过滤更积极。
#   - 调小到 0.10：更保守，但可能漏掉边界噪声。
# - vertical_tolerance: 0.15
#   - 允许斜坡或地面高度起伏，避免必须处于完全相同的 Z 层。
#   - 当前 z 分辨率是 0.1 m，代码会向上取整体素，所以实际搜索约为上下各 0.2 m。
#   - 平坦场景可以改成 0.10；坡地建议保留 0.15。
# - minimum_terrain_neighbors: 6
#   - 至少发现 6 个标签为 1/2/3 的邻居才允许重分类。
#   - 增大更保守，减小更积极。
# - minimum_distinct_terrain_labels: 2
#   - 必须位于两种不同地形类别的交界处。
#   - 这是防止真实小障碍被删除的重要条件。
#   - 改成 1 会同时清理单一地面内部的小黑点，但也更可能误删真实小障碍。
# - minimum_terrain_ratio: 0.70
#   - 周围已分类点中，至少 70% 必须是地形。
#   - 提高到 0.80～0.85 更保守。
#   - 降到 0.60 会清理更多噪声，但更容易影响真实障碍边缘。

terrain_boundary_filter_enabled: true
terrain_boundary_obstacle_label: 0
terrain_boundary_terrain_labels: [1, 2, 3]
terrain_boundary_opening_radius_cells: 3
terrain_boundary_neighborhood_radius: 0.40
terrain_boundary_vertical_tolerance: 0.15
terrain_boundary_minimum_terrain_neighbors: 4
terrain_boundary_minimum_distinct_terrain_labels: 2
terrain_boundary_minimum_terrain_ratio: 0.70

terrain_height_cost_enabled: false
input_layout: point_cloud
point_stride: 1
semantic_field: semantic_lable
semantic_label_remap: []
confidence_field: semantic_confidence
cost_field: traversability
default_semantic_confidence: 1.0
transform_timeout: 0.2
timing_report_frames: 50

voxel_size_xy: 0.10
voxel_size_z: 0.10
decay_seconds: 0.5
max_voxels: 300000
max_range: -1.0
# Fixed map_start admission envelope. Keep this wider than the sensor-local box
# so normal elevation/pitch variation is not clipped after frame conversion.
min_z: -5.0
max_z: 4.0
local_radius: -1.0
local_box_enabled: true
local_box_min_x: -2.0
local_box_max_x: 10.0
local_box_min_y: -5.0
local_box_max_y: 5.0
local_box_min_z: -2.0
local_box_max_z: 4.0
robot_body_exclusion_enabled: false

semantic_positive_update: 1.0
semantic_negative_update: -0.1
semantic_min_log_evidence: -4.59512
semantic_max_log_evidence: 4.59512
semantic_new_class_prior: 0.8

unknown_cost: 0.50
traversability_fusion_method: confidence_weighted_raise
semantic_risk_alpha: 0.80
semantic_cost_weight: 0.0
cost_rise_alpha: 0.70
cost_fall_alpha: 0.15

# Background and manhole covers are unconditional semantic obstacles. The
# terrain classes stay below FAR's 0.60 local obstacle threshold and are
# promoted to a safety obstacle only when measured/fused cost requires it.
semantic_classes:
  - {label: 0, name: background_obstacle, color: [0, 0, 0],     cost: 1.00}
  - {label: 1, name: flat_ground,         color: [0, 255, 0],   cost: 0.05}
  - {label: 2, name: grass,               color: [0, 128, 0],   cost: 0.25}
  - {label: 3, name: rough_ground,        color: [160, 82, 45], cost: 0.45}
  - {label: 4, name: manhole_cover,       color: [128, 128, 128], cost: 1.00}

publish_rate: 10.0
marker_alpha: 0.85
map_file: /tmp/five_class_local3d_semantic_voxel_map.csv
