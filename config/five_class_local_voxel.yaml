# Five-class /grids_points 的局部 voxel 算法参数。
# label、名称、颜色、导航角色、语义代价和输入字段名只在
# five_class_semantic_schema.yaml 中定义，本文件不保存类别表副本。

input_topic: /grids_points
global_frame: map
use_initial_pose_reference: true
# Keep map_start gravity-aligned: remove only the initial translation and yaw.
initial_pose_reference_yaw_only: true
reference_frame: map_start
local_cost_frame: wuba_base
publish_local_cost_cloud: true
global_admission_output_frame: wuba_base
global_admission_exclude_dynamic: true

# The generic direct encoder assumes Cityscapes label meanings.  This dataset
# uses a different label contract, so the configurable SSMI grid adapter owns
# the conversion instead.
# 关闭 local voxel 节点自带的“直接 SSMI 格式点云发布器”。当前设成 false 是正确的，因为自带直接编码器使用固定的 canonical/Cityscapes 颜色编码，并不了解你的五分类语义含义。
publish_ssmi_admitted_cloud: false
ssmi_admitted_topic: /semantic_pcl/five_class_global_admitted
ssmi_obstacle_traversability_threshold: 0.75

# 这些参数控制“SSMI 旧障碍撤销”机制：
# 某个体素以前作为障碍写进了 SemanticOctomap，后来被稳定观测为平地时，发布删除证据，把旧障碍从全局地图中清除。
enable_ssmi_obstacle_revocation: true
ssmi_revocation_voxel_size: 0.10
ssmi_revocation_minimum_free_frames: 5 # 至少 5 个不同采集帧提供自由证据；不要求连续，也不要求标签相同
ssmi_revocation_minimum_free_duration: 0.5 # 从第一次仍有效的自由证据到当前至少跨越 0.5 秒，避免瞬时误清除
ssmi_revocation_minimum_free_evidence: 5.0 # 置信度加权后的累计自由证据门限；一次高质量几何重分类贡献 1.0
ssmi_revocation_free_evidence_decay_per_second: 0.5 # 没有新自由证据时每秒衰减多少；偶发语义抖动不会清零，长时间无证据会自然失效
ssmi_revocation_free_max_traversability: 0.45 # 作为自由地形证据的点，代价必须 <=0.45
ssmi_revocation_minimum_semantic_confidence: 0.60 # 自由地形语义置信度必须 >=0.60
ssmi_revocation_ray_evidence_enabled: false # 当前不使用传感器射线穿透作为自由证据
ssmi_revocation_ray_endpoint_margin: 0.20 # 开启射线证据时，不使用射线末端最后 0.2 m，防止表面回波清除自己
ssmi_revocation_ray_point_stride: 2 # 开启射线证据时，每隔 2 个输入点构造一条射线
ssmi_revocation_ambiguous_obstacle_labels: [0] # label 0 是语义不明确的背景；低几何代价时不因一次标签回跳而清空已有自由证据
ssmi_revocation_ambiguous_obstacle_reset_min_traversability: 0.65 # label 0 的原始几何代价达到该值才作为明确障碍并立即清空自由证据
# 障碍、地形和动态类别由共享 schema 的 role 自动生成。上面的列表不是角色表，
# 而是只针对“语义会抖动但仍有真实观测”的特殊撤销策略。

# 静态障碍地面恢复。实际执行链只有：
# 可通行体素投影为二维白色栅格 -> 膨胀 -> 腐蚀 -> 得到完整地面支持区
# -> 与已有静态障碍体素求交 -> 高差检查 -> 复制最近可通行体素的类别和代价。
# 不读取候选自身 measured traversability，不做中值、柱、邻居数量、代价差、平面或投票检查。

# 步骤 0：总开关与角色。共享 semantic_schema 中 terrain 是白色地面，
# static_obstacle 全部可恢复，dynamic_obstacle/ignore 排除。
terrain_boundary_filter_enabled: true # false：完全跳过恢复，所有输出保持原始局部voxel快照

# 步骤 1：把全部 terrain 体素按XY投影为白色，执行一次“先膨胀、后腐蚀”。
terrain_boundary_closing_radius: 0.2 # 单位m；0.10m分辨率时向上取整为2格，使用5x5椭圆核；它限制可跨越缝隙/小块的宽度

# 步骤 2：闭运算后的完整白色区域与 recoverable static 体素求交。
# 因此既处理闭运算新填的小孔/窄缝，也处理同一XY已有terrain、其他Z仍有静态噪点的情况。
# 无点位置绝不创建体素；动态/ignore绝不进入候选。第6幅“新增白色”仅保留作诊断。

# 步骤 3：在闭运算半径内找最近的原始 terrain 体素，比较绝对Z高差。
terrain_boundary_max_height_difference: 0.15 # 单位m；高差不超过此值才恢复，调大可恢复起伏地面但更可能误放低矮物体

# 步骤 4：通过后直接复制该最近 terrain 体素的label、语义置信度、语义代价和几何/融合可通行代价。
# 同一份过滤后快照继续生成局部规划代价云、全局建图准入点云和FAR使用的局部语义点云。

# 调试只有下面两个总开关；两者都为false时不构造任何调试数据，不影响地面恢复本身。
terrain_boundary_debug_opencv_enabled: false # OpenCV端：弹出自动刷新的3x3阶段窗口，并允许直接点击栅格查看判断记录
terrain_boundary_debug_rviz_enabled: true # RViz端：同时发布stages_image和decision_cloud、显示机器人位置，并启用Publish Point查询

# 以下不是开关，只调节两个调试端共同使用的日志、点击和可选CSV行为。
terrain_boundary_debug_statistics_interval_frames: 10 # 每10个真实输入帧打印terrain/静态候选/动态排除/提议/高差结果数量；定时重发不计帧
terrain_boundary_debug_max_samples_per_reason: 1 # 每次统计时每种结果最多打印1个体素详情；0只打印汇总
terrain_boundary_debug_clicked_point_topic: /clicked_point # geometry_msgs/PointStamped；必要时转换到当前mapFrame
terrain_boundary_debug_clicked_point_radius: 0.20 # 点击点0.20m内查找最近的可恢复静态体素记录
terrain_boundary_debug_csv_path: "" # 空字符串不写；绝对路径会逐帧追加简化后的全部判断字段

terrain_height_cost_enabled: false
input_layout: point_cloud
point_stride: 1
semantic_label_remap: []
confidence_field: semantic_confidence
default_semantic_confidence: 1.0
transform_timeout: 0.2
timing_report_frames: 50

voxel_size_xy: 0.10
voxel_size_z: 0.10
decay_seconds: 0.5
max_voxels: 300000
max_range: -1.0
# Fixed map_start admission envelope. Keep this wider than the sensor-local box
# so normal elevation/pitch variation is not clipped after frame conversion.
min_z: -5.0
max_z: 4.0
local_radius: -1.0
local_box_enabled: true
local_box_min_x: -2.0
local_box_max_x: 10.0
local_box_min_y: -5.0
local_box_max_y: 5.0
local_box_min_z: -2.0
local_box_max_z: 4.0
robot_body_exclusion_enabled: false

semantic_positive_update: 1.0
semantic_negative_update: -0.1
semantic_min_log_evidence: -4.59512
semantic_max_log_evidence: 4.59512
semantic_new_class_prior: 0.8

unknown_cost: 0.50
# Preserve hard semantic obstacle costs instead of attenuating them by the
# dominant-class confidence when measured traversability is lower.
traversability_fusion_method: maximum
semantic_risk_alpha: 0.80
semantic_cost_weight: 0.0
cost_rise_alpha: 0.70
cost_fall_alpha: 0.15

publish_rate: 10.0
marker_alpha: 0.85
map_file: /tmp/five_class_local3d_semantic_voxel_map.csv
