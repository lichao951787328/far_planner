# Dynamic Planner Default Params
main_run_freq                           : 2.5
contour_grid_resolution                 : 0.2   # Unit: meter
enable_goal_recording                   : true
goal_record_file                        : ""
robot_dim                               : 0.5   # Unit: meter
vehicle_height                          : 0.5   # Unit: meter
sensor_range                            : 20.0  # Contour canvas half-extent: 20 m in +/-X and +/-Y
terrain_range                           : 7.5   # Unit: meter
local_planner_range                     : 2.5   # Unit: meter
visualize_ratio                         : 0.4
is_viewpoint_extend                     : true
is_multi_layer                          : false
is_opencv_visual                        : false # Obstalce Image Display
is_static_env                           : true
is_pub_boundary                         : false  
is_debug_output                         : false
is_attempt_autoswitch                   : true  # Auto switch to attemptable navigation
world_frame                             : map
input_mode                              : global_semantic_compat
semantic_profile                       : matterport_legacy
global_static_map_topic                 : /octomap_full
odom_timeout                            : 3.0   # seconds; tolerates a slow graph-update cycle
semantic_map_timeout                    : 3.0   # seconds; <= 0 disables the check
odom_connection_update_distance         : 0.2   # Unit: meter

# Graph Messager
GraphMsger/robot_id                     : 1  # graph from robot id "0" is extracted from files

# Map Handler Params
MapHandler/floor_height                 : 2.0    # Unit: meter
MapHandler/semantic_local_window_radius : 20.0   # 40 m x 40 m robot-centred semantic query window
MapHandler/terrain_search_radius        : 0.8    # XY fallback for terrain height
MapHandler/terrain_neighbor_radius      : 1.0    # XY terrain-support radius (2 m diameter)
MapHandler/local_planner_radius         : 5.0
MapHandler/local_planner_resolution     : 0.2
MapHandler/local_planner_obstacle_intensity: 200.0
MapHandler/semantic_top1_only           : true
MapHandler/semantic_min_probability     : 0.55   # Reserved while binary top-1 mode is active
MapHandler/obstacle_groups:
  - {name: chair,         rgb: [0, 33, 193]}
  - {name: television,    rgb: [0, 67, 130]}
  - {name: table,         rgb: [0, 101, 68]}
  - {name: boundary_wall, rgb: [0, 134, 5]}
  - {name: maze_wall,     rgb: [0, 168, 199]}
MapHandler/terrain_support_groups:
  - {name: background_floor, rgb: [0, 0, 0]}
  - {name: staircase,        rgb: [255, 165, 0]}
MapHandler/dynamic_obstacle_groups:
  - {name: dynamic_obstacle, rgb: [255, 0, 255]}
MapHandler/cell_length                  : 2.5    # Unit: meter
MapHandler/map_grid_max_length          : 200.0  # Unit: meter
MapHandler/map_grad_max_height          : 10.0   # Unit: meter

# Dynamic Planner Utility Params
Util/angle_noise                        : 15.0  # Unit: degree
Util/accept_max_align_angle             : 4.0   # Unit: degree
Util/robot_collision_clearance          : 0.45
Util/visibility_edge_projection         : 0.15
Util/obs_inflate_size                   : 1
Util/new_intensity_thred                : 2.0
Util/terrain_free_Z                     : 0.15
Util/dyosb_update_thred                 : 4
Util/new_point_counter                  : 5
Util/dynamic_obs_dacay_time             : 10.0  # Unit: second
Util/new_points_decay_time              : 1.0   # Unit: second

# Dynamic Graph Params
Graph/connect_votes_size                : 10        
Graph/clear_dumper_thred                : 4
Graph/node_finalize_thred               : 6
Graph/filter_pool_size                  : 12
Graph/static_update_radius              : 28.5
Graph/static_stitch_radius              : 28.5
Graph/dynamic_position_alpha            : 0.65
Graph/static_confirm_frames             : 3
Graph/static_remove_frames              : 3
Graph/static_topology_remove_frames     : 5       # Replacement is committed only after stable successor topology passes connectivity protection
Graph/static_visibility_remove_frames   : 3
Graph/static_duplicate_radius           : 0.5
Graph/static_promotion_requires_finalized: true
Graph/static_promotion_requires_active_edge: true
Graph/static_promotion_requires_main_component: true
# Compatibility mode has no independent global confirmation stream.
Graph/static_promotion_requires_global_evidence: false
Graph/diagnostic_near_pair_radius       : 0.0

ContourGraph/projection_min             : 0.15
ContourGraph/projection_step            : 0.075
ContourGraph/projection_max             : 0.60
ContourGraph/boundary_guard             : 0.40

# Corner Detector Params
CDetector/resize_ratio                  : 3.0
CDetector/filter_count_value            : 3
CDetector/dynamic_simplify_ratio         : 2.0
CDetector/collinear_tolerance            : 0.20
CDetector/collinear_angle_deg            : 8.0
CDetector/is_save_img                   : false
CDetector/img_folder_path               : /path

# Graph Planner Params
GPlanner/converge_distance              : 0.25  # Unit: meter
GPlanner/goal_adjust_radius             : 1.0   # Unit: meter
GPlanner/free_counter_thred             : 7
GPlanner/reach_goal_vote_size           : 3
# Goal uses the original FAR full-graph connection validation. Historical
# trajectory/path nodes are intentionally absent from this semantic graph.
GPlanner/path_momentum_thred            : 0
