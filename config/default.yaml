# Dynamic Planner Default Params
main_run_freq                           : 2.5
# FAR轮廓投影画布的基础栅格分辨率；不等同于上游OctoMap分辨率。
contour_grid_resolution                 : 0.4   # Unit: meter; independent semantic contour grid
enable_goal_recording                   : true
goal_record_file                        : ""    # Empty: <far_planner package>/logs/goal_selections.csv
# 表示机器人的几何尺寸/半径（这里更接近机器人占用半径或安全半径）。
robot_dim                               : 0.6   # Unit: meter
# 计算哪些点被认为是可通行/可碰撞的高度范围
# 影响地形高度和障碍过滤时的上下限判断
# Go2 base_link (about 0.291 m) minus the occupied floor-voxel center
# (about -0.2 m) is 0.491 m. A rounded 0.5 m also covers its body/sensor height.
vehicle_height                          : 0.5   # Unit: meter
sensor_range                            : 20.0  # Contour canvas half-extent: 20 m in +/-X and +/-Y
# 主要用于局部地形/周围环境分析的范围
terrain_range                           : 15.0  # Unit: meter
# 局部规划器关注的范围。这个值越大，局部规划会更“看远一点”。
local_planner_range                     : 5.0   # Unit: meter
visualize_ratio                         : 0.75
# 是否启用“视点前推/前视延伸”。也就是在规划路径时，沿着当前可通行方向把 waypoint 再往前推一点，形成更平滑的目标点。设为 true 时，路径更像“前瞻点”，会更顺滑。
is_viewpoint_extend                     : true
# 是否启用多层/多高度层的规划。
# 这里是 false，说明当前用的是单层/普通的平面式规划。
is_multi_layer                          : false
is_opencv_visual                        : false # Obstalce Image Display
is_static_env                           : false
# 是否发布局部边界线给下游局部规划器。false 时不会把边界消息发布出去
is_pub_boundary                         : false
# 是否输出调试信息。true 时会打印更多日志、调试状态
is_debug_output                         : false
# 是否开启“自动切换到可尝试导航模式”的机制。
is_attempt_autoswitch                   : true  # Auto switch to attemptable navigation
world_frame                             : map
semantic_map_topic                      : octomap_full
# Compatibility default: legacy deployments continue to derive their current
# contours from SemanticOcTree. SSMI enables the dual-input mode below.
use_local_voxel_map                     : false
local_voxel_topic                       : /local_3d_semantic_voxel_map/voxel_cloud
local_voxel_timeout                     : 0.5   # wall time since the last strictly newer acquisition; <=0 disables
# Safety watchdogs use message receipt wall-time, so they remain effective
# even when simulated ROS time is paused.
odom_timeout                            : 3.0   # seconds; tolerates a slow graph-update cycle
semantic_map_timeout                    : 3.0   # seconds; <= 0 disables the check
# Rebuild only the transient robot/start edges after this much planar motion.
odom_connection_update_distance         : 0.2   # Unit: meter

# Graph Messager
GraphMsger/robot_id                     : 1  # graph from robot id "0" is extracted from files

# Map Handler Params
# 表示地面/楼层的高度基准。这个值会影响点云被怎么划分到地面层和障碍层。地面应该空出多高来处理环境.
MapHandler/floor_height                 : 3.0     # Unit: meter
MapHandler/semantic_local_window_radius : 20.0    # 40 m x 40 m robot-centred semantic query window
MapHandler/terrain_search_radius        : 0.8     # XY fallback for terrain height
MapHandler/terrain_neighbor_radius      : 1.0     # XY terrain-support radius (2 m diameter)
MapHandler/local_planner_radius         : 10.0    # 10 m radius: about 20 m x 20 m local collision-map coverage
MapHandler/local_planner_resolution     : 0.2     # Dense XY sampling resolution for occupied octree voxels
MapHandler/local_planner_obstacle_intensity: 200.0 # Hard-obstacle value for static and dynamic layers
MapHandler/local_voxel_resolution       : 0.10
MapHandler/local_voxel_min_semantic_confidence: 0.55
MapHandler/local_voxel_obstacle_cost_threshold: 0.60
MapHandler/local_voxel_static_labels    : [2, 3, 4, 5, 6, 7, 8]
MapHandler/local_voxel_terrain_labels   : [0, 1, 9]
MapHandler/local_voxel_dynamic_labels   : [11, 12, 13, 14, 15, 16, 17, 18]
# SemanticOcTree classification uses the normalized probability of its top-1
# class. Values below this threshold are UNKNOWN and cannot add a classified
# cloud point or provide EXPLICIT_FREE evidence. ColorOcTree has no semantic
# distribution, so it remains an exact-RGB compatibility path. Set the
# threshold to 0.0 to disable confidence filtering and restore the legacy RGB
# fallback for SemanticOcTree nodes without a semantic distribution.
MapHandler/semantic_top1_only           : true
MapHandler/semantic_min_probability     : 0.55
MapHandler/obstacle_groups:
  - {name: chair,         rgb: [0, 33, 193]}
  - {name: television,    rgb: [0, 67, 130]}
  - {name: table,         rgb: [0, 101, 68]}
  - {name: boundary_wall, rgb: [0, 134, 5]}
  - {name: maze_wall,     rgb: [0, 168, 199]}
MapHandler/terrain_support_groups:
  - {name: background_floor, rgb: [0, 0, 0]}
  - {name: staircase,        rgb: [255, 165, 0]}
MapHandler/dynamic_obstacle_groups:
  - {name: dynamic_obstacle, rgb: [255, 0, 255]}
# 把整个环境切成很多小格子,每个格子的边长就是 cell_length
MapHandler/cell_length                  : 5.0     # Unit: meter
MapHandler/map_grid_max_length          : 1000.0  # Unit: meter
MapHandler/map_grad_max_height          : 100.0   # Unit: meter

# Dynamic Planner Utility Params
# 作用：控制角度匹配时允许的噪声范围。
# 代码里会把它转成弧度后用于图节点/轮廓匹配的角度判断。
# 数值越大，越宽松；越容易把两个方向看成“对得上”。
Util/angle_noise                        : 15.0 # Unit: degree
# 作用：更严格的“接受对齐”的角度阈值。
# 也就是“只有当夹角小于这个值时，才认为这两个几何方向是匹配的”。
# 这里设成 4°，说明对齐要求比较严格。
Util/accept_max_align_angle             : 4.0  # Unit: degree
Util/robot_collision_clearance          : 0.45 # Unit: meter; independent of contour raster resolution
Util/visibility_edge_projection         : 0.15 # Unit: meter; ordinary visibility-edge endpoint offset
# 作用：对障碍区域做膨胀/扩张。
# 例如设成 1，表示把检测到的障碍边缘稍微外扩一圈，避免机器人把障碍边缘附近当成可通行。
# 数值越大，越保守。
Util/obs_inflate_size                   : 1
# 作用：决定“哪些点算新出现的点/新增障碍”。
# 代码里是用强度值做比较，低于这个阈值时会被认为是新增点。
# 阈值越大，越不容易把点判定为“新增”。
Util/new_intensity_thred                : 2.0
# 作用：把点云分成“自由点”和“障碍点”的高度差阈值。
# 代码里是按点的 intensity 是否小于这个值来区分：
# 小于它：归为自由点
# 大于它：归为障碍点
# 所以它直接影响当前帧里哪些点被认为可穿越、哪些被认为是障碍。
# 这个在后续上楼梯时需要更改
Util/terrain_free_Z                     : 0.2
# 检测到动态障碍时的阈值。越大，越不容易因为少量点就认为有动态障碍
Util/dyosb_update_thred                 : 4
# 在半径 kMatchDist 范围内，统计新增点云中落在该点附近的点数 near_c，然后：
# 若是创建新节点场景：阈值取 KNewPointC / 2（即 5/2 ≈ 2），更宽松，容易认定"附近有新增点"
# 若是更新已有节点场景：阈值取 KNewPointC（即 5），更严格
Util/new_point_counter                  : 5
# 动态障碍点在地图里保留多久。越大，系统越不容易“忘记”刚刚看到的动态障碍
# 先把它从“长期/当前静态障碍地图”中移除
# 但保留在“动态障碍临时缓冲”中，直到超时才真正丢弃
Util/dynamic_obs_dacay_time             : 1.0 # Unit: second
# 新增点的保留时间。越小，系统越快忘掉旧的新增点，适合更快更新。
Util/new_points_decay_time              : 1.0  # Unit: second

# Dynamic Graph Params
# 创建入口在 dynamic_graph.h:537，可以看到同一套 NavNode 会被标记成不同“角色”：
# 里程计节点（is_odom）
# 中间导航点（is_navpoint）
# 目标点（is_goal）
# 边界点（is_boundary）
# 普通由轮廓提取出来的导航候选点

# 连边投票窗口大小。两节点是否真正连通，不是一次判断决定，而是看最近 N 次投票结果。值越大越稳（不容易误连、误断），但响应更慢；值越小更灵敏，但更容易抖动。
Graph/connect_votes_size                : 8
# 节点清除计数阈值。某节点连续“复检失败”超过阈值才会被真正清掉。值越大越稳（不容易误删），但响应更慢；值越小更灵敏，但更容易误删。
Graph/clear_dumper_thred                : 4
# 节点“定型”阈值。用于多个地方的最终确认：地形连通投票、frontier 判定、位置/方向 RANSAC 内点数、轨迹边失效计数。值大更稳定但慢，值小更快但易受噪声影响。
Graph/node_finalize_thred               : 6
# 节点位置和表面方向滤波缓存池大小（滑动窗口长度），RANSAC 从这批样本里做稳健估计。值大更平滑更抗噪，但对突变反应慢；值小更跟手，但易抖动。
Graph/filter_pool_size                  : 12
Graph/static_update_radius              : 28.5    # Covers the corners of the +/-20 m square semantic window
Graph/static_stitch_radius              : 28.5    # Keep/reconnect visible static corners across the complete local square
Graph/start_connection_max_distance    : -1.0    # <=0 keeps legacy unlimited odom/start query edges; scenario overlays may set a finite radius
Graph/dynamic_position_alpha            : 0.65    # Current-frame weight for matched dynamic routing vertices
Graph/diagnostic_near_pair_radius       : 0.0     # Disabled normally; positive values publish rejected near-pair diagnostics
Graph/static_confirm_frames             : 3       # Positive semantic observations before persistence
Graph/static_remove_frames              : 3       # Consecutive local misses before true static deletion
Graph/static_topology_remove_frames     : 5       # FAR-style recoverable contradictions; replacement also requires RANSAC-stable successors, a validated contour route and no static cut
Graph/static_visibility_remove_frames   : 3       # First static failure blocks search; only this many consecutive failures delete visibility-edge history
Graph/static_duplicate_radius           : 0.5     # Conservative same-class/same-direction duplicate suppression radius
Graph/static_promotion_requires_finalized: true   # Do not persist a geometrically unstable contour corner
Graph/static_promotion_requires_active_edge: true # Do not create permanent degree-zero static orphans
Graph/static_promotion_requires_main_component: true # Promote only through reusable topology grown from the persisted confirmed main component
Graph/static_promotion_requires_global_evidence: false # Dual-input mode overrides true; legacy current SemanticOcTree observations remain compatible

# Same-current-contour edges search outward for the first fully collision-free
# robot-centre segment. These values do not alter ordinary visibility edges.
ContourGraph/projection_min             : 0.15
ContourGraph/projection_step            : 0.075
ContourGraph/projection_max             : 0.60
ContourGraph/boundary_guard             : 0.40 # 2 contour cells; cropped raster vertices cannot become wall ends

# Corner Detector Params  控制“把障碍点云投影成图像后怎么提轮廓”。
# 图像放大倍数（轮廓提取前先 resize）。
# 大一些：轮廓点更密、角点更细，但计算量更高；
# 小一些：更快，但细节容易丢，角点可能更粗糙。
CDetector/resize_ratio                  : 3.0
# 二值化阈值。每个像素周围累计到多少“点云命中计数”才算障碍。
# 大一些：更保守，弱噪声会被滤掉，但细小障碍可能消失；
# 小一些：更敏感，小障碍更容易保留，但噪声也更容易进来
CDetector/filter_count_value            : 3
CDetector/dynamic_simplify_ratio         : 2.0     # Stronger RDP/min-spacing filter for unstable dynamic contours
CDetector/collinear_tolerance            : 0.20    # World-space max deviation for removing a straight-wall middle vertex
CDetector/collinear_angle_deg            : 8.0     # Preserve real corners; collapse only near-180-degree wall samples
# 是否把中间生成的障碍图保存到磁盘
# true：便于调试（能回看每帧图像），但会有 I/O 开销；
# false：不落盘，运行更轻。
CDetector/is_save_img                   : false
# 保存图像的目录路径（仅在 is_save_img=true 时有效）。
CDetector/img_folder_path               : /path

# Graph Planner Params
# 目标收敛距离。越小，说明越希望机器人精确逼近目标。
GPlanner/converge_distance              : 0.5  # Unit: meter
# 目标附近的调整范围。越大，说明目标附近的规划更宽松。
## 目标附近的调整范围。表示在目标附近，规划器允许把目标位置“往周围轻微调整”的范围。
## 越大，说明在目标附近更宽松，规划器更容易找一个更容易到达的替代点；越小则更严格，偏向直接逼近精确目标。
GPlanner/goal_adjust_radius             : 2.0  # Unit: meter
# 影响“认为某块区域是空闲/可通行”的阈值。越大，越保守。
# 这是一个“可通行性阈值”。表示某个区域要被认为“空闲/可通行”，需要满足多少次/多少份支持。
# 越大，越保守：只有更明确的空闲证据才会认为这里可走。这会让规划更安全，但也可能让机器人更容易避让，路径更绕。
GPlanner/free_counter_thred             : 7
# 目标到达投票数/支持票数。
# 表示要确认“已经到达目标”，需要多少次投票或判断满足。
# 越大，越不容易因为一次偶然判断就误判为到达。
GPlanner/reach_goal_vote_size           : 3
# Goal 与原 FAR Planner 一致：对当前可搜索图中的全部障碍轮廓节点逐一验证连边。
# 本版本不会把历史路径点加入搜索图，因此这些点也不会成为 Goal 候选。
# 路径惯性/持续性阈值。
# 用来控制“是否继续沿着之前的路径方向走”，避免因为短暂抖动而频繁改变方向。
# 越大，越倾向保持原来的路径方向，路径更平滑；越小，越容易快速切换。
GPlanner/path_momentum_thred            : 0       # Always search the current graph; never reuse an old path
